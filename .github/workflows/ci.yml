name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # One command per line: `set -e` ignores all but the last of an && chain.
      - name: Lint
        shell: bash
        run: |
          go mod tidy
          (cd internal/separate-module-tests && go mod tidy)
          go fmt ./...
          (cd internal/separate-module-tests && go fmt ./...)
          (cd internal/tools/apigen && go fmt ./...)
          (cd internal/tools/apigen && go run .)
          git diff --exit-code

      # shell: bash is required: Windows defaults to pwsh, which has no `set -e`.
      - name: Test
        shell: bash
        env:
          # Forks won't have these secrets so e2e tests skip, but pushes
          # to main will run them.
          BASETEN_E2E_TEST_API_KEY: ${{ secrets.BASETEN_E2E_TEST_API_KEY }}
          BASETEN_E2E_TEST_DOMAIN: ${{ secrets.BASETEN_E2E_TEST_DOMAIN }}
          BASETEN_E2E_TEST_MODEL_ID: ${{ secrets.BASETEN_E2E_TEST_MODEL_ID }}
        run: |
          go test ./...
          (cd internal/separate-module-tests && go test ./...)
      # PROBE BRANCH ONLY, removed with the branch: the probe arms log what
      # their outcome MEANS, and go test without -v suppresses a passing
      # test's logs — so the null reading ("both arms green = UNMEASURED")
      # would vanish from the log exactly when it matters most. This step
      # runs the probe verbosely so the reading lands beside the result
      # whichever way it goes.
      - name: Probe (verbose readings)
        run: go test -run TestProbe -v ./internal/volume/
